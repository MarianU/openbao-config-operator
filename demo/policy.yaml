apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoPolicy
metadata:
  name: secret-reader
  namespace: mto-extension-openbao-system
spec:
  policy: |
    path "secret/data/public/*" {
      capabilities = ["read", "list"]
    }
    path "secret/metadata/public/*" {
      capabilities = ["list"]
    }
