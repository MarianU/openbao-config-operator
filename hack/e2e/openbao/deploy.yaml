apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  namespace: openbao
spec:
  replicas: 1
  selector:
    matchLabels: { app: openbao }
  template:
    metadata:
      labels: { app: openbao }
    spec:
      containers:
        - name: openbao
          image: ghcr.io/openbao/openbao:latest
          args: ["server","-dev","-dev-listen-address=0.0.0.0:8200","-dev-root-token-id=root"]
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: "root"
            - name: VAULT_ADDR
              value: "http://0.0.0.0:8200"
          ports:
            - name: http
              containerPort: 8200
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&perfstandbyok=true
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&perfstandbyok=true
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
