apiVersion: v1
kind: ServiceAccount
metadata:
  name: mto-openbao-extension
  namespace: mto-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mto-openbao-extension-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: mto-openbao-extension
    namespace: mto-system
