apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoExtension
metadata:
  name: openbao-integration
  namespace: mto-extension-openbao-system

spec:
  server:
    url: http://openbao.openbao.svc.cluster.local:8200
    tokenSecretRef:
      name: mto-openbao-token
      key: token

  # --- What parts of Bao auth the operator should manage ---
  authManagement:
    kubernetes: ensure                  # off | ensure  → mount/configure auth/kubernetes for workload SAs
    oidc: ensure                        # off | ensure  → mount/configure auth/oidc (or jwt) for human users

  # --- Where OIDC settings come from (your SSO extension publishes this contract) ---
  sso:
    mode: cluster                           # enum: cluster | secret | inline | disabled
    clusterRef:
      name: default
    roleResolution:
      # Evaluate per-tenant: extract {{ .tenant }} from matched group; do not cross tenants.
      # If multiple groups match within the same tenant, apply tieBreakStrategy.
      claim: groups                         # e.g. "groups" in OIDC/JWT
      patterns: # At least one pattern
        - match: tenant-{{ .tenant }}-owners
          role: owner                       # enum: owner | editor | viewer
        - match: tenant-{{ .tenant }}-editors
          role: editor
        - match: tenant-{{ .tenant }}-viewers
          role: viewer
      tieBreakStrategy: highest             # highest | lowest | deny
      fallback: deny                        # owner | editor | viewer | deny

  # --- Tenancy model + defaults used in path templates, roles, etc. ---
  tenancy:
    mode: path                              # path | namespace (path = works on OSS; namespace for enterprise builds later)
    defaults:
      env: prod

  # --- Naming & path templates (reused by engines below) ---
  layout:
    templates:
      # Logical KV path (operator maps to data/ & metadata/ endpoints internally)
      kv: "secret/tenants/{{ .tenant }}/{{ .env }}/{{ .namespace }}/{{ .app }}/{{ .name }}"

  # --- RBAC defaults for projected secrets (REQUIRED) -------------------------
  rbac:
    roleScope: namespace                    # enum: namespace | app
    defaultCapability: editor               # enum: admin | editor | viewer | none
    token:
      ttl: 1h                               # default=1h
      maxTTL: 4h                            # default=4h
      renewable: true                       # optional; allow renewal if supported

  # Bao policy roles: admin | editor | viewer | none
  tenantRoleMapping:
    # data: [create,update,patch,delete,read,list]; metadata: [read,list,delete]
    owner: admin                            # enum: admin | editor | viewer | none
    # data: [create,update,patch,read,list];        metadata: [read,list]
    editor: editor
    # data: [read,list];                            metadata: [read,list]
    viewer: viewer
    # NOTE: if any of these is "none", corresponding capability tier overrides are ignored.

  # --- Optional: override capability sets for tiers (applies cluster-wide) ---
  # If you omit this block, built-ins are used:
  #   admin:  [create, read, update, delete, list]
  #   editor: [create, read, update, list]      (no delete)
  #   viewer: [read, list]
  policyOverrides:
    editor:
      capabilities: [ create, read, update, list ]
    viewer:
      capabilities: [ read, list ]            # enum verbs: create | read | update | delete | list
    admin:
      capabilities: [ create, read, update, delete, list ]

  engines:
    - name: kv
      type: kv-v2
      layoutRef: kv
      enabled: true                         # default=true

      # Mount strategy: using a shared cluster mount "secret" (works everywhere). No destructive ops.
      strategy:
        scope: cluster                      # enum: cluster | tenant
        mount:
          path: secret                      # becomes /v1/secret (kv-v2)
          manage: ensure                    # "off" | adopt | ensure → adopt uses if present; ensure creates if missing

      policies:
        presets: [admin, editor, viewer]    # enum: admin | editor | viewer | none

      projection:
        mode: external-secrets              # enum: external-secrets | csi | none
        secretStore:                        # REQUIRED when mode=external-secrets
          name: my-eso                      # ExternalSecret Store name
          scope: namespace                  # enum: namespace | cluster


  # --- Scaffolding helpers (REQUIRED) -----------------------------------------
  scaffolding:
    mode: on-annotation                     # enum: none | on-annotation
    annotations:
      enable: mto.secrets/enable            # default key; explicit here for clarity
      env: mto.secrets/env
      keys: mto.secrets/keys

  # --- Safety controls (REQUIRED) ---------------------------------------------
  safety:
    allowDeletes: false                      # In kv-v2: delete = hide a version; destroy = permanent
