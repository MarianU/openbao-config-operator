---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: openbaogeneratedsecrets.security.mto.stakater.com
spec:
  group: security.mto.stakater.com
  names:
    kind: OpenBaoGeneratedSecret
    listKind: OpenBaoGeneratedSecretList
    plural: openbaogeneratedsecrets
    shortNames:
    - obgen
    singular: openbaogeneratedsecret
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mount
      name: Mount
      type: string
    - jsonPath: .spec.path
      name: Path
      type: string
    - jsonPath: .spec.rotationPeriod
      name: Rotation
      type: string
    - jsonPath: .status.version
      name: Version
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OpenBaoGeneratedSecret is the Schema for the openbaogeneratedsecrets
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OpenBaoGeneratedSecretSpec defines the desired state.
            properties:
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy controls what happens to the bao-side secret when this
                  CR is deleted. Retain (the default) orphans the secret; Delete removes
                  it. The value is data-bearing, so the fail-safe direction is Retain.
                enum:
                - Retain
                - Delete
                type: string
              generator:
                description: Generator controls how the random value is produced.
                properties:
                  charset:
                    description: |-
                      Charset selects the character pool. One of: alphaNumSpecial (default:
                      lower+upper+digits+symbols), alphaNum, alpha, lower, upper, numeric,
                      hex.
                    enum:
                    - alphaNumSpecial
                    - alphaNum
                    - alpha
                    - lower
                    - upper
                    - numeric
                    - hex
                    type: string
                  key:
                    default: value
                    description: |-
                      Key is the secret key under which the generated value is stored in
                      bao (and therefore in the VSO-materialized Kubernetes Secret).
                      Defaults to "value".
                    type: string
                  length:
                    default: 24
                    description: |-
                      Length is the length of the generated value, excluding Prefix.
                      Defaults to 24. Must be between 1 and 1024.
                    maximum: 1024
                    minimum: 1
                    type: integer
                  prefix:
                    description: |-
                      Prefix is a literal string prepended to the generated value (e.g.
                      "$2b$"). Excluded from Length. Rarely needed.
                    type: string
                type: object
              mount:
                default: secret
                description: Mount is the KVv2 secret-engine mount path. Defaults
                  to "secret".
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9_./-]*$
                type: string
              openbaoNamespace:
                description: OpenBaoNamespace targets a bao namespace.
                pattern: ^([a-z0-9]([-a-z0-9/]*[a-z0-9])?/?)?$
                type: string
              path:
                description: |-
                  Path is the secret's key path within the mount (e.g. "apps/db/admin").
                  The full bao path is <mount>/data/<path>. Defaults to metadata.name.
                maxLength: 253
                minLength: 1
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9_./-]*$
                type: string
              rotationPeriod:
                description: |-
                  RotationPeriod is how long OpenBao's stored value stays valid before
                  the operator regenerates and rewrites it (e.g. 720h for 30 days). 0
                  means generate once and never rotate. Rotation is not exact: the
                  operator reconciles periodically, so a value may rotate up to ~5m past
                  this deadline.
                type: string
            required:
            - path
            type: object
          status:
            description: OpenBaoGeneratedSecretStatus defines the observed state.
            properties:
              baoWritten:
                type: boolean
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastRequestedRotation:
                description: |-
                  LastRequestedRotation is the last on-demand rotation token (value of
                  the RotationAnnotationKey annotation) this controller has processed,
                  so a repeated annotation value does not rotate again. Empty means no
                  on-demand rotation has been processed yet.
                type: string
              lastRotation:
                description: |-
                  LastRotation is when the value was last generated and written. 0 means
                  never generated yet.
                format: date-time
                type: string
              lastWrittenBaoName:
                type: string
              lastWrittenMount:
                description: |-
                  LastWrittenMount captures the KVv2 mount the controller last wrote
                  into, for rename cleanup across a simultaneous path + mount edit.
                type: string
              lastWrittenOpenBaoNamespace:
                type: string
              version:
                description: Version is bao's KVv2 version of the last written value.
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
