                type: array
              tokenMaxTtl:
                pattern: ^([0-9]+(ns|us|ms|s|m|h|d))+$
                type: string
              tokenPolicies:
                description: |-
                  TokenPolicies is the list of bao policies granted on a
                  successful login.
                items:
                  type: string
                type: array
              tokenTtl:
                description: TokenTTL / TokenMaxTTL are bao duration strings.
                pattern: ^([0-9]+(ns|us|ms|s|m|h|d))+$
                type: string
              userClaim:
                description: |-
                  UserClaim is the JWT claim bao uses as the identity entity
