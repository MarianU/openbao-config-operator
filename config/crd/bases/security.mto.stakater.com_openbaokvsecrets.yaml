---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: openbaokvsecrets.security.mto.stakater.com
spec:
  group: security.mto.stakater.com
  names:
    kind: OpenBaoKvSecret
    listKind: OpenBaoKvSecretList
    plural: openbaokvsecrets
    shortNames:
    - obkvs
    singular: openbaokvsecret
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mount
      name: Mount
      type: string
    - jsonPath: .spec.path
      name: Path
      type: string
    - jsonPath: .status.version
      name: Version
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OpenBaoKvSecret is the Schema for the openbaokvsecrets API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OpenBaoKvSecretSpec defines the desired state.
            properties:
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy controls what happens to the bao-side secret when this
                  CR is deleted. Retain (the default) releases the CR without touching
                  bao — the secret survives as an intentional orphan. Delete removes the
                  secret. KV is data-bearing, so the fail-safe direction is Retain; use
                  Delete only where the secret must not outlive its CR.
                enum:
                - Retain
                - Delete
                type: string
              ensureSecret:
                description: |-
                  EnsureSecret creates an empty Kubernetes Secret named by
                  SourceSecret when it does not exist yet, so a bootstrap can anchor
                  the Secret and have real values filled in later.
                type: boolean
              mount:
                default: secret
                description: Mount is the KVv2 secret-engine mount path. Defaults
                  to "secret".
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9_./-]*$
                type: string
              openbaoNamespace:
                description: OpenBaoNamespace targets a bao namespace.
                pattern: ^([a-z0-9]([-a-z0-9/]*[a-z0-9])?/?)?$
                type: string
              path:
                description: |-
                  Path is the secret's key path within the mount (e.g. "apps/foo").
                  The full bao path is <mount>/data/<path>. Defaults to metadata.name.
                maxLength: 253
                minLength: 1
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9_./-]*$
                type: string
              sourceSecret:
                description: |-
                  SourceSecret names a Kubernetes Secret in this CR's namespace that
                  owns the desired data. The operator copies this Secret's data into
                  bao and re-syncs on every change. No secret material lives in the CR.
                minLength: 1
                type: string
            required:
            - path
            - sourceSecret
            type: object
          status:
            description: OpenBaoKvSecretStatus defines the observed state.
            properties:
              baoWritten:
                type: boolean
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastWrittenBaoName:
                type: string
              lastWrittenMount:
                description: |-
                  LastWrittenMount captures the KVv2 mount the controller last wrote
                  into. Without this, a CR that simultaneously edits spec.path AND
                  spec.mount would orphan the secret at the OLD mount — the
                  rename-cleanup BaoDeleteIdentity would target the NEW mount and
                  silently 404. The controller reads this field on rename cleanup so
                  the previous secret is removed at its real bao location.
                type: string
              lastWrittenOpenBaoNamespace:
                type: string
              version:
                description: Version is bao's KVv2 version of the last successfully
                  written secret.
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
