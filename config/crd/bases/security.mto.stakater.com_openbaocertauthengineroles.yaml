                type: array
              tokenMaxTtl:
                pattern: ^([0-9]+(ns|us|ms|s|m|h|d))+$
                type: string
              tokenPeriod:
                pattern: ^([0-9]+(ns|us|ms|s|m|h|d))+$
                type: string
              tokenPolicies:
                description: |-
                  TokenPolicies is the list of bao policies granted on a
                  successful login with this cert.
                items:
                  type: string
                type: array
              tokenTtl:
                description: TokenTTL / TokenMaxTTL / TokenPeriod are bao duration
