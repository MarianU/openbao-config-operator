---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: openbaopkisecretengineconfigs.security.mto.stakater.com
spec:
  group: security.mto.stakater.com
  names:
    kind: OpenBaoPKISecretEngineConfig
    listKind: OpenBaoPKISecretEngineConfigList
    plural: openbaopkisecretengineconfigs
    shortNames:
    - obpkic
    singular: openbaopkisecretengineconfig
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OpenBaoPKISecretEngineConfig is the Schema for the
          openbaopkisecretengineconfigs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OpenBaoPKISecretEngineConfigSpec defines the desired state.
            properties:
              commonName:
                description: CommonName is the X.509 CN of the generated CA cert.
                  Required.
                maxLength: 253
                minLength: 1
                type: string
              keyBits:
                description: |-
                  KeyBits is the key size in bits. RSA: 2048|3072|4096.
                  EC: 224|256|384|521. Ignored for ed25519. Zero = bao default.
                maximum: 8192
                minimum: 0
                type: integer
              keyType:
                description: |-
                  KeyType is the public-key algorithm. Defaults to bao's default
                  (rsa) when empty.
                enum:
                - rsa
                - ec
                - ed25519
                type: string
              openbaoNamespace:
                description: |-
                  OpenBaoNamespace targets a specific OpenBao namespace via
                  X-Vault-Namespace. Empty = root.
                pattern: ^([a-z0-9]([-a-z0-9/]*[a-z0-9])?/?)?$
                type: string
              path:
                description: |-
                  Path is the bao-side PKI mount path (e.g. "pki", "pki/internal").
                  Must match an existing OpenBaoSecretEngine of kind=pki at the
                  same path; the controller does NOT enable the mount itself.
                maxLength: 128
                minLength: 1
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9_./-]*$
                type: string
              pkiType:
                description: |-
                  PKIType selects the CA generation flavour. Only "root" is
                  supported. The enum is open-ended so other generation
                  flavours can be added additively without a CRD-shape break.
                enum:
                - root
                type: string
              subject:
                description: Subject groups the X.509 subject fields beyond CommonName.
                properties:
                  country:
                    items:
                      type: string
                    type: array
                  locality:
                    items:
                      type: string
                    type: array
                  organization:
                    items:
                      type: string
                    type: array
                  ou:
                    items:
                      type: string
                    type: array
                  postalCode:
                    items:
                      type: string
                    type: array
                  province:
                    items:
                      type: string
                    type: array
                  streetAddress:
                    items:
                      type: string
                    type: array
                type: object
              ttl:
                description: |-
                  TTL is the validity period of the CA cert as a bao duration
                  string (e.g. "87600h" for 10 years). Empty = bao default
                  (currently 30 days, deliberately short — set this for any
                  production CA).
                pattern: ^([0-9]+(ns|us|ms|s|m|h|d))+$
                type: string
              urls:
                description: |-
                  URLs configures the CA's published distribution points (AIA,
                  CRL, OCSP) embedded in every issued cert.
                properties:
                  crlDistributionPoints:
                    items:
                      type: string
                    type: array
                  issuingCertificates:
                    items:
                      type: string
                    type: array
                  ocspServers:
                    items:
                      type: string
                    type: array
                type: object
            required:
            - commonName
            - path
            - pkiType
            type: object
          status:
            description: OpenBaoPKISecretEngineConfigStatus defines the observed state.
            properties:
              baoWritten:
                description: |-
                  BaoWritten records whether this CR has ever successfully
                  generated a CA. Not used by the deletion path (IsDeletable=false
                  short-circuits BaoDelete unconditionally) but kept for status
                  observability.
                type: boolean
              caSerialNumber:
                description: |-
                  CASerialNumber is the X.509 serial of the active CA cert,
                  captured from the bao response on initial generate. Surfaced
                  for operator visibility.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastWrittenBaoName:
                description: |-
                  LastWrittenBaoName records the PKI mount path the controller
                  last wrote a CA into. A spec.path change that produces a
                  different LastWrittenBaoName would leak a CA at the old mount
                  (because IsDeletable=false skips rename cleanup); the controller
                  logs this and advances the identity. Document and avoid renames
                  in production.
                type: string
              lastWrittenOpenBaoNamespace:
                description: LastWrittenOpenBaoNamespace tracks the bao namespace
                  context.
                type: string
              phase:
                description: |-
                  Phase tracks the CA-bootstrap state.
                  "" = no CA yet (just before first BaoWrite).
                  "Active" = CA generated and URLs published.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
