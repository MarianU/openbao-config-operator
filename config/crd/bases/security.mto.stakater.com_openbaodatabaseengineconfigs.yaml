---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: openbaodatabaseengineconfigs.security.mto.stakater.com
spec:
  group: security.mto.stakater.com
  names:
    kind: OpenBaoDatabaseEngineConfig
    listKind: OpenBaoDatabaseEngineConfigList
    plural: openbaodatabaseengineconfigs
    shortNames:
    - obdbcn
    singular: openbaodatabaseengineconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.pluginName
      name: Plugin
      type: string
    - jsonPath: .spec.mount
      name: Mount
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OpenBaoDatabaseEngineConfig is the Schema for the
          openbaodatabaseengineconfigs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OpenBaoDatabaseEngineConfigSpec defines the desired state.
            properties:
              allowedRoles:
                description: |-
                  AllowedRoles is the set of role names permitted on this connection
                  (server-enforced via allowed_roles).
                items:
                  type: string
                type: array
              connectionUrl:
                description: |-
                  ConnectionURL is the plugin connection template. It must contain the
                  {{username}} and typically {{password}} placeholders; the controller
                  interpolates the credentials resolved from spec.credentialsRef.
                minLength: 1
                type: string
              credentialsRef:
                description: |-
                  CredentialsRef references the k8s Secret holding the connection admin
                  username/password. Never persisted to the CR.
                properties:
                  name:
                    description: Name of the Secret holding the credentials.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the Secret. Defaults to this CR's namespace.
                    type: string
                  passwordKey:
                    default: password
                    description: PasswordKey is the Secret key holding the password.
                    type: string
                  usernameKey:
                    default: username
                    description: UsernameKey is the Secret key holding the username.
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy controls what happens to the bao-side connection when
                  this CR is deleted or its bao identity changes. Retain (the default)
                  releases the CR without touching bao — the connection survives as a
                  logged orphan; use it so churn can never drop a connection that live
                  roles depend on. Delete removes the connection.
                enum:
                - Retain
                - Delete
                type: string
              maxConnectionLifetime:
                description: |-
                  MaxConnectionLifetime is a bao duration for max reuse of a single
                  connection.
                pattern: ^([0-9]+(ns|us|ms|s|m|h|d))+$
                type: string
              maxIdleConnections:
                description: MaxIdleConnections caps the idle pool. 0 = plugin default.
                type: integer
              maxOpenConnections:
                description: MaxOpenConnections caps the pool. 0 = plugin default.
                type: integer
              mount:
                default: database
                description: |-
                  Mount is the bao-side database engine mount. Defaults to "database".
                  All connections share this single mount.
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9_./-]*$
                type: string
              name:
                description: Name is the bao-side connection name. Defaults to metadata.name.
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              openbaoNamespace:
                description: OpenBaoNamespace targets a bao namespace.
                pattern: ^([a-z0-9]([-a-z0-9/]*[a-z0-9])?/?)?$
                type: string
              passwordPolicy:
                description: |-
                  PasswordPolicy names a password policy applied to generated
                  credential passwords.
                type: string
              pluginName:
                description: |-
                  PluginName is the database plugin serving this connection, e.g.
                  "mysql-database-plugin" or "postgresql-database-plugin".
                minLength: 1
                type: string
              tlsServerName:
                description: TLSServerName overrides the TLS server-name validation
                  hostname.
                type: string
              tlsSkipVerify:
                description: TLSSkipVerify disables TLS verification for the connection.
                type: boolean
              verifyConnection:
                default: true
                description: VerifyConnection pings the database on write.
                type: boolean
            required:
            - connectionUrl
            - credentialsRef
            - pluginName
            type: object
          status:
            description: OpenBaoDatabaseEngineConfigStatus defines the observed state.
            properties:
              baoWritten:
                type: boolean
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastWrittenBaoName:
                type: string
              lastWrittenMount:
                description: |-
                  LastWrittenMount captures the bao mount the config was last written
                  into so a simultaneous spec.mount + spec.name edit cleans up the
                  previous connection at its real bao location.
                type: string
              lastWrittenOpenBaoNamespace:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
