    plural: openbaojwtoidcauthengineconfigs
    shortNames:
    - objwtcfg
    singular: openbaojwtoidcauthengineconfig
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OpenBaoJWTOIDCAuthEngineConfig is the Schema for the
          openbaojwtoidcauthengineconfigs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OpenBaoJWTOIDCAuthEngineConfigSpec defines the desired state.
            properties:
              boundIssuer:
                description: |-
                  BoundIssuer narrows accepted tokens to those whose "iss" claim
                  matches.
                type: string
              defaultRole:
                description: |-
                  DefaultRole names the role bao falls back to when the inbound
                  login does not pick one. Must reference an
                  OpenBaoJWTOIDCAuthEngineRole at the same mount.
                type: string
              jwksCaPem:
                description: |-
                  JWKsCAPEM is the optional PEM-encoded CA bundle used to verify
                  the JWKS URL's TLS cert.
                type: string
              jwksUrl:
                description: |-
                  JWKsURL is a static JWKS endpoint bao polls for token-signing
                  keys. Mutually exclusive with oidcDiscoveryUrl in the typical
                  OIDC case; for plain JWT auth, JWKsURL is the primary key
                  source.
                type: string
              jwtSupportedAlgs:
                description: |-
                  JWTSupportedAlgs restricts which JWT signing algorithms bao
                  will accept (e.g. RS256, ES256).
                items:
                  type: string
                type: array
              jwtValidationPubkeys:
                description: |-
                  JWTValidationPubkeys is the list of static PEM-encoded public
                  keys bao validates inbound tokens against. Mutually exclusive
                  with oidcDiscoveryUrl + jwksUrl.
                items:
                  type: string
                type: array
              oidcClientId:
                description: |-
                  OIDCClientID is the OAuth2 client id bao presents to the
                  provider.
                type: string
              oidcClientSecretRef:
                description: |-
                  OIDCClientSecretRef points at a Kubernetes Secret holding the
                  OAuth2 client_secret. The cleartext value never lands in the
                  CR spec.
                properties:
                  key:
                    type: string
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              oidcDiscoveryCaPem:
                description: |-
                  OIDCDiscoveryCAPEM is the optional PEM-encoded CA bundle used
                  to verify the discovery URL's TLS cert.
                type: string
              oidcDiscoveryUrl:
                description: |-
                  OIDCDiscoveryURL is the OIDC provider's well-known discovery
                  endpoint. Mutually exclusive with jwksUrl /
                  jwtValidationPubkeys; bao validates inbound tokens against
                  the keys this URL advertises.
                type: string
              oidcResponseMode:
                description: |-
                  OIDCResponseMode is bao's "response_mode" param to the OIDC
                  provider on login.
                enum:
                - query
                - form_post
                type: string
              oidcResponseTypes:
                description: |-
                  OIDCResponseTypes is bao's "response_type" list. Typical
                  values are "code" or "id_token".
                items:
                  type: string
                type: array
              openbaoNamespace:
                description: OpenBaoNamespace targets a specific OpenBao namespace.
                pattern: ^([a-z0-9]([-a-z0-9/]*[a-z0-9])?/?)?$
                type: string
              path:
                description: |-
                  Path is the bao-side jwt or oidc auth mount path. Pairs with an
                  OpenBaoAuthMethod of type=jwt or type=oidc at the same path.
                maxLength: 128
                minLength: 1
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9_./-]*$
                type: string
            required:
            - path
            type: object
          status:
            description: OpenBaoJWTOIDCAuthEngineConfigStatus defines the observed
              state.
            properties:
              baoWritten:
                type: boolean
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastWrittenBaoName:
                type: string
              lastWrittenOpenBaoNamespace:
                type: string
              lastWrittenSecretMac:
                description: |-
                  LastWrittenSecretMAC is the HMAC-SHA256 (base64) of the
                  Secret-sourced field values the operator last successfully wrote
                  to bao. The drift comparator compares the freshly-recomputed MAC
                  against this on each reconcile; a mismatch signals that the
                  underlying Secret rotated and the operator must re-write.
                  Empty until the first successful write. See [hmacstore](../../internal/hmacstore).
                type: string
              resolvedClientSecret:
                description: |-
                  ResolvedClientSecret holds the cleartext value
                  PrepareInternalValues pulled from spec.oidcClientSecretRef.
                  Surfaced for drift comparison only — the operator's status
                  store is the same etcd that would otherwise hold the inline
                  cleartext, so this is no worse than inlining; the Secret-ref
                  pattern is about not putting it in the CR YAML manifest.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
