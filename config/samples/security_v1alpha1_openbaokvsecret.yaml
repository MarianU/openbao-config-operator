apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoKvSecret
metadata:
  name: app-settings
  namespace: openbao-config-operator-system
spec:
  # KVv2 secret-engine mount. Defaults to "secret".
  # mount: secret

  # Secret key path within the mount. The full bao path is
  # <mount>/data/<path>. Defaults to metadata.name.
  path: apps/settings

  # THE OWNER OF THE VALUE IS A KUBERNETES SECRET, NOT THIS CR.
  # This CR is reference-only: the operator copies the named Secret's data
  # into OpenBao and re-syncs whenever it changes. No secret material ever
  # lives in Git or in this CR.
  sourceSecret: app-settings

  # Create the (empty) source Secret if it does not exist yet, so a
  # bootstrap can anchor the Secret and have real values filled in later.
  ensureSecret: true

  # openbaoNamespace targets a specific OpenBao namespace via the
  # X-Vault-Namespace header. Empty (the default) means root.
  # openbaoNamespace: acme/

  # Data-bearing kind: Retain (default) orphans the secret on CR delete;
  # Delete removes it.
  deletionPolicy: Retain
