apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoGeneratedSecret
metadata:
  name: db-admin
  namespace: openbao-config-operator-system
spec:
  # KVv2 secret-engine mount. Defaults to "secret".
  # mount: secret

  # Secret key path within the mount. The full bao path is
  # <mount>/data/<path>. Defaults to metadata.name.
  path: apps/db/admin

  # Re-generate + rewrite the value in OpenBao once this period elapses
  # since the last rotation. 0 = generate once, never rotate.
  rotationPeriod: 720h
  # On-demand rotate (no spec change):
  #   kubectl annotate <cr> security.mto.stakater.com/rotate="$(date +%s)"

  generator:
    # Key under which the value is stored in bao / the VSO K8s Secret.
    key: password
    # Value length (excluding prefix). Default 24.
    length: 24
    # lower+upper+digits+symbols (default); also alphaNum, alpha, lower,
    # upper, numeric, hex.
    charset: alphaNumSpecial
    # Optional literal prefix, excluded from length.
    # prefix: "$2b$"

  # openbaoNamespace targets a specific OpenBao namespace via the
  # X-Vault-Namespace header. Empty (the default) means root.
  # openbaoNamespace: acme/

  # Data-bearing kind: Retain (default) orphans the value on CR delete;
  # Delete removes it.
  deletionPolicy: Retain
