apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoTransitKey
metadata:
  name: app-key
  namespace: openbao-config-operator-system
spec:
  # Path must match an existing OpenBaoSecretEngine with spec.transit at
  # the same path. Defaults to "transit".
  path: transit

  # Optional: scope this CR to a specific OpenBao namespace.
  # openbaoNamespace: team-a/

  # Bao-side key name. Required.
  name: app-key

  # Algorithm. Immutable post-create — editing it surfaces Ready=False
  # reason=Invalid. A re-created CR whose spec matches the existing bao
  # key adopts it; a divergent type fails loudly with the same Invalid.
  # Switching algorithms therefore means a new key: delete the CR,
  # destroy the bao-side key by hand, re-create.
  type: aes256-gcm96

  # AutoRotatePeriod is a Go duration string ("720h"); "0" disables.
  # bao does NOT accept "30d" — use hours.
  autoRotatePeriod: "720h"

  # deletionAllowed sets bao's deletion_allowed flag, gating DELETE for
  # callers of the bao API. It does NOT make CR deletion remove the key —
  # this kind never deletes its bao object. Set true only to permit a
  # deliberate `bao delete transit/keys/app-key` done by hand.
  # deletionAllowed: true
