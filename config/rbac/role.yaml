---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - security.mto.stakater.com
  resources:
  - openbaoextensions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - security.mto.stakater.com
  resources:
  - openbaoextensions/finalizers
  verbs:
  - update
- apiGroups:
  - security.mto.stakater.com
  resources:
  - openbaoextensions/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - tenantoperator.stakater.com
  resources:
  - tenants
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - tenantoperator.stakater.com
  resources:
  - tenants/status
  verbs:
  - get
