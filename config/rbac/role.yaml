---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - security.mto.stakater.com
  resources:
  - openbaoextensions
  - openbaokubernetesauthroles
  - openbaonamespaces
  - openbaopolicies
  - openbaosecretengines
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - security.mto.stakater.com
  resources:
  - openbaoextensions/finalizers
  - openbaokubernetesauthroles/finalizers
  - openbaonamespaces/finalizers
  - openbaopkisecretengineconfigs/finalizers
  - openbaopkisecretengineroles/finalizers
  - openbaopolicies/finalizers
  - openbaosecretengines/finalizers
  verbs:
  - update
- apiGroups:
  - security.mto.stakater.com
  resources:
  - openbaoextensions/status
  - openbaokubernetesauthroles/status
  - openbaonamespaces/status
  - openbaopkisecretengineconfigs/status
  - openbaopkisecretengineroles/status
  - openbaopolicies/status
  - openbaosecretengines/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - security.mto.stakater.com
  resources:
  - openbaopkisecretengineconfigs
  - openbaopkisecretengineroles
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tenantoperator.stakater.com
  resources:
  - tenants
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - tenantoperator.stakater.com
  resources:
  - tenants/status
  verbs:
  - get
