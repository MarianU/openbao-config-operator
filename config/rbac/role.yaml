---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - security.mto.stakater.com
  resources:
  - openbaointegrations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - security.mto.stakater.com
  resources:
  - openbaointegrations/finalizers
  verbs:
  - update
- apiGroups:
  - security.mto.stakater.com
  resources:
  - openbaointegrations/status
  verbs:
  - get
  - patch
  - update
