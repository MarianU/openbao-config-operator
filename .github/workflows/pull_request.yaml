name: Pull Request

on:
  pull_request:
    branches:
      - main
      - release
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'examples/**'

permissions:
  contents: read

jobs:
  validate:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.4
          args: --timeout=10m
          install-mode: goinstall

      - name: Unit + envtest tests
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out
