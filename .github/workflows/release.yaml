name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.4
          args: --timeout=10m
          install-mode: goinstall
      - name: Unit + envtest tests
        run: make test

  release:
    name: Build + Push Operator Image + Chart
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU / Buildx
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute registry refs
        id: registry
        run: |
          REPO="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" |
            tr '[:upper:]' '[:lower:]')"
          echo "repo=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

      - name: Build + push operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.registry.outputs.repo }}:${{ steps.meta.outputs.version }}
            ${{ steps.registry.outputs.repo }}:latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Generate + package Helm chart
        run: |
          VER="${GITHUB_REF_NAME#v}"
          IMG="${{ steps.registry.outputs.repo }}:${VER}"
          make chart IMG="$IMG"
          mkdir -p dist
          helm package ./charts/openbao-config-operator \
            --version "${{ steps.meta.outputs.version }}" -d dist

      - name: Push Helm chart (OCI)
        run: |
          helm registry login ghcr.io \
            -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          for pkg in dist/*.tgz; do
            helm push "$pkg" \
              oci://ghcr.io/${{ steps.registry.outputs.owner }}/charts
          done
