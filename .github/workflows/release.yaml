name: Release

# On a version tag vX.Y.Z, operator_release.yaml builds the operator and
# publishes version X.Y.Z twice: the image and bundle to ghcr.io/stakater and
# ghcr.io/stakater/public, the chart to ghcr.io/stakater/charts and
# ghcr.io/stakater/public/charts. The public copies allow anonymous pulls, and
# the public chart defaults to the public image.
on:
  push:
    tags:
      - 'v[012].[0-9]+.[0-9]+'
      - '!v[012].[0-9]+.[0-9]+-*'

jobs:
  operator-release:
    name: Operator Release
    uses: stakater/.github/.github/workflows/operator_release.yaml@main
    secrets:
      CONTAINER_REGISTRY_URL: ghcr.io/stakater
      CONTAINER_REGISTRY_USERNAME: stakater-user
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.STAKATER_DELIVERY_SLACK_WEBHOOK }}
    with:
      GO_VERSION: "1.26"
      ENABLE_LINTING: true
      ENABLE_UNIT_TESTS: true
      ENABLE_CHART_PUSH: true
      LATEST_TAG_NAME: "latest"
