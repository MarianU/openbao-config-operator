run:
  timeout: 5m
  allow-parallel-runners: true

issues:
  # don't skip warning about doc comments
  # don't exclude the default set of lint
  exclude-use-default: false
  # restore some of the defaults
  # (fill in the rest as needed)
  exclude-rules:
    - path: "api/*"
      linters:
        - lll
    - path: "internal/*"
      linters:
        - dupl
        - lll
    # e2e specs are per-CRD lifecycle scripts with the same
    # Eventually-WithTimeout shape repeated for every primitive. dupl and
    # lll flag the boilerplate without flagging actual logic; excluding
    # them lets the suite stay one-file-per-CRD instead of being
    # shoe-horned into a table-driven form that hurts spec-failure
    # diagnostics.
    - path: "test/e2e/.*"
      linters:
        - dupl
        - lll
        - unparam
linters:
  disable-all: true
  enable:
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - gofmt
    - goimports
    - gosimple
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - staticcheck
    - typecheck
    - unconvert
    - unparam
    - unused
